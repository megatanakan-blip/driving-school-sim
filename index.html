<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ドライビングスクール｜交差点教習</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column}header{padding:9px 13px;background:#17232e;display:flex;align-items:center;justify-content:space-between;font-weight:800}#hud{font-size:14px;display:flex;gap:12px}#scene{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}#msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#111c27dd;border-radius:12px;padding:8px 12px;font-weight:bold;text-align:center;white-space:nowrap;font-size:14px}#overlay{position:absolute;inset:0;background:#06101acc;display:flex;align-items:center;justify-content:center;padding:18px}#card{max-width:350px;background:#192735;border:1px solid #ffffff30;border-radius:18px;padding:22px;text-align:center}h1{font-size:24px;margin:0 0 10px}p{color:#d0d9e2;line-height:1.65}button{border:0;border-radius:14px;font-weight:900;touch-action:none;user-select:none}#startBtn{background:#ffcf25;color:#17202a;padding:14px 22px;font-size:18px}#controls{background:#17232e;display:flex;justify-content:space-between;align-items:center;padding:9px 12px 14px;gap:8px}#steering{display:flex;gap:7px}#controls button{height:62px;width:70px;background:#354b5d;color:white;font-size:26px}#controls .pedal{width:82px;background:#ffcf25;color:#17202a;font-size:15px}#controls #brake{background:#ed4949;color:#fff}small{font-size:11px;color:#9fb1c2}
</style>
</head>
<body><div id="app">
<header><span>🚗 ドライビングスクール</span><div id="hud"><span>速度 <b id="speed">0</b></span><span>点数 <b id="score">100</b></span></div></header>
<div id="scene"><canvas id="game"></canvas><div id="msg">安全確認をして発進してください</div><div id="overlay"><div id="card"><h1>はじめての交差点</h1><p>アクセルで進み、左右で車線内を走行。<br>赤信号では停止線の手前で停止しよう。<br>横断歩道の歩行者にも注意！</p><button id="startBtn">教習開始</button><p><small>スマホ：画面下のボタン / PC：矢印キー・WASD</small></p></div></div></div>
<div id="controls"><div id="steering"><button id="left">◀</button><button id="right">▶</button></div><button id="brake" class="pedal">ブレーキ</button><button id="gas" class="pedal">アクセル</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,D;let running=false,finished=false,speed=0,score=100,meters=0,lane=0,throttle=false,braking=false,steer=0,light='green',crossed=false,penaltyOnce=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function draw(){
ctx.clearRect(0,0,W,H);
let horizon=H*.43,bottom=H*1.12,center=W/2+lane*W*.15,topWidth=W*.15,bottomWidth=W*1.15,phase=meters*.006;
let sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#71c6f5');sky.addColorStop(1,'#d9efff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.57);
ctx.fillStyle='#7aa56e';ctx.beginPath();ctx.moveTo(0,H*.48);for(let x=0;x<=W;x+=24)ctx.lineTo(x,H*.43+Math.sin(x*.014+phase)*14);ctx.lineTo(W,H*.6);ctx.lineTo(0,H*.6);ctx.fill();
for(let i=0;i<13;i++){let x=((i*83-phase*24)%(W+90)+W+90)%(W+90)-35,bw=30+i%4*13,bh=42+i%5*15;ctx.fillStyle=['#b9c7cb','#c9bda9','#a7b9bc'][i%3];ctx.fillRect(x,H*.43-bh,bw,bh);ctx.fillStyle='#71858c';for(let y=H*.43-bh+8;y<H*.43-5;y+=12)for(let xx=x+5;xx<x+bw-4;xx+=11)ctx.fillRect(xx,y,5,5)}
ctx.fillStyle='#55585b';ctx.beginPath();ctx.moveTo(center-topWidth/2,horizon);ctx.lineTo(center+topWidth/2,horizon);ctx.lineTo(center+bottomWidth/2,bottom);ctx.lineTo(center-bottomWidth/2,bottom);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(center-topWidth/2,horizon);ctx.lineTo(center-bottomWidth/2,bottom);ctx.moveTo(center+topWidth/2,horizon);ctx.lineTo(center+bottomWidth/2,bottom);ctx.stroke();
for(let i=0;i<14;i++){let p=((i/14+meters*.0008)%1),y=horizon+(bottom-horizon)*p,ww=2+p*6;ctx.fillStyle='#f5f0d9';ctx.fillRect(center-ww/2,y,ww,8+p*22)}
let remaining=620-meters;if(remaining>-130&&remaining<850){let p=Math.max(0,Math.min(1,1-remaining/850)),y=horizon+(bottom-horizon)*p,half=topWidth/2+(bottomWidth/2-topWidth/2)*p;ctx.fillStyle='#4a4c4e';ctx.fillRect(center-half,y-15*p,half*2,35*p);if(p>.15){ctx.fillStyle='#f4f4f4';for(let i=0;i<7;i++)ctx.fillRect(center-half+i*(half*2/7),y-3*p,half*2/14,4+5*p)}}
let sx=center+topWidth*.72,sy=H*.22;ctx.fillStyle='#333';ctx.fillRect(sx,sy,5,H*.17);ctx.fillStyle='#222';ctx.fillRect(sx-13,sy-4,30,65);['red','yellow','green'].forEach((col,i)=>{ctx.beginPath();ctx.arc(sx+2,sy+10+i*21,8,0,Math.PI*2);ctx.fillStyle=light===col?({red:'#ff3434',yellow:'#ffd338',green:'#32dc62'}[col]):'#454545';ctx.fill()});
if(meters>480&&meters<720&&!crossed)light=meters<600?'green':'red';if(meters>=720)light='green';
if(meters>500&&meters<720){let px=center+bottomWidth*.22,py=H*.65;ctx.strokeStyle='#20252b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(px,py-18,7,0,Math.PI*2);ctx.moveTo(px,py-10);ctx.lineTo(px,py+10);ctx.moveTo(px,py);ctx.lineTo(px-9,py+6);ctx.moveTo(px,py);ctx.lineTo(px+9,py+6);ctx.moveTo(px,py+10);ctx.lineTo(px-7,py+23);ctx.moveTo(px,py+10);ctx.lineTo(px+7,py+23);ctx.stroke()}
let cx=W/2+lane*W*.14,cy=H*.82;ctx.fillStyle='#171a1d';ctx.beginPath();ctx.moveTo(cx-W*.13,cy+32);ctx.lineTo(cx-W*.11,cy-8);ctx.lineTo(cx-W*.075,cy-34);ctx.lineTo(cx+W*.075,cy-34);ctx.lineTo(cx+W*.11,cy-8);ctx.lineTo(cx+W*.13,cy+32);ctx.closePath();ctx.fill();ctx.fillStyle='#bd3430';ctx.fillRect(cx-W*.112,cy-10,W*.224,40);ctx.fillStyle='#9bd8eb';ctx.beginPath();ctx.moveTo(cx-W*.072,cy-30);ctx.lineTo(cx+W*.072,cy-30);ctx.lineTo(cx+W*.09,cy-12);ctx.lineTo(cx-W*.09,cy-12);ctx.fill();ctx.fillStyle='#ffe4a0';ctx.fillRect(cx-W*.105,cy+19,W*.035,7);ctx.fillRect(cx+W*.07,cy+19,W*.035,7);
requestAnimationFrame(draw)}
draw();
function tick(){if(!running||finished)return;if(throttle)speed=Math.min(40,speed+.18);else speed=Math.max(0,speed-.04);if(braking)speed=Math.max(0,speed-.55);meters+=speed*.1;lane=Math.max(-1.25,Math.min(1.25,lane+steer*.018));
if(Math.abs(lane)>1.05)score-=.02;
if(meters>610&&meters<690&&light==='red'&&speed>1&&!penaltyOnce){score-=25;penaltyOnce=true;document.getElementById('msg').textContent='🚨 赤信号！停止線で止まろう';}
if(meters>520&&meters<720&&speed>12)score-=.025;
if(meters>760){finished=true;running=false;speed=0;document.getElementById('overlay').style.display='flex';document.getElementById('card').innerHTML='<h1>教習終了！</h1><p>走行距離：'+Math.round(meters)+'m<br>評価点：'+Math.max(0,Math.round(score))+'点</p><button onclick="location.reload()" id="startBtn">もう一度</button>';}
document.getElementById('speed').textContent=Math.round(speed)+' km/h';document.getElementById('score').textContent=Math.max(0,Math.round(score));if(meters<400)document.getElementById('msg').textContent='発進！前方を確認';requestAnimationFrame(tick)}
document.getElementById('startBtn').onclick=()=>{running=true;document.getElementById('overlay').style.display='none';document.getElementById('msg').textContent='発進！前方を確認';requestAnimationFrame(tick)};
function hold(id,fn){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true);el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>fn(false)))}
hold('gas',v=>throttle=v);hold('brake',v=>braking=v);hold('left',v=>steer=v?-1:0);hold('right',v=>steer=v?1:0);
addEventListener('keydown',e=>{if(['ArrowUp','w'].includes(e.key))throttle=true;if(['ArrowDown','s'].includes(e.key))braking=true;if(['ArrowLeft','a'].includes(e.key))steer=-1;if(['ArrowRight','d'].includes(e.key))steer=1});
addEventListener('keyup',e=>{if(['ArrowUp','w'].includes(e.key))throttle=false;if(['ArrowDown','s'].includes(e.key))braking=false;if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))steer=0});
</script></body></html>
